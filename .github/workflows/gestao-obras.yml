name: Gestão de Obras

on:
  push:
    paths: ["gestao-obras/**", ".github/workflows/gestao-obras.yml"]
  pull_request:
    paths: ["gestao-obras/**", ".github/workflows/gestao-obras.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-obras
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obras
          POSTGRES_PASSWORD: obras_dev
          POSTGRES_DB: obras
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obras" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://obras:obras_dev@localhost:5432/obras?schema=public
      TEST_DATABASE_URL: postgresql://obras:obras_dev@localhost:5432/obras_test?schema=public
      E2E_DATABASE_URL: postgresql://obras:obras_dev@localhost:5432/obras_e2e_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestao-obras/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: gestao-obras/test-results
