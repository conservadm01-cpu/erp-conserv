; Painel de cardápio para ESP32 + tela TFT (TFT_eSPI).
; Abra esta pasta no VS Code com PlatformIO e escolha o ambiente da sua tela.
; No Arduino IDE, abra PainelCardapio/PainelCardapio.ino (veja o README).

[platformio]
src_dir = PainelCardapio
default_envs = cyd-28

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0

; ESP32-2432S028R ("Cheap Yellow Display"), ILI9341 2,8" 320x240
[env:cyd-28]
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000

; Tela genérica ILI9488 3,5" 480x320 ligada no SPI padrão do ESP32 DevKit
[env:ili9488-35]
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
