<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Academia ConServ — Conhecimento que vira qualidade</title>
    <meta name="description" content="Plataforma de capacitação, segurança, qualidade e desenvolvimento profissional da ConServ Confecções." />
    <link rel="manifest" href="/academia.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c2b39" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Academia ConServ" />
    <!--
      Fonte carregada sem bloquear a renderização: se a rede estiver lenta
      ou indisponível (fábrica offline, celular sem sinal), o app abre na
      hora com a fonte do sistema e troca para a Inter quando ela chegar.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="academia-root"></div>
    <script type="module" src="/src/academia/main.tsx"></script>
  </body>
</html>
