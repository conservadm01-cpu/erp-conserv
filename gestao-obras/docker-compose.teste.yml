# VERSÃO DE TESTE — sobe banco, caixa de e-mail e aplicação com dados fictícios.
#   docker compose -f docker-compose.teste.yml up -d --build
#   Aplicação:        http://localhost:3000
#   E-mails enviados: http://localhost:8025
#   Encerrar:         docker compose -f docker-compose.teste.yml down
#   Apagar os dados:  docker compose -f docker-compose.teste.yml down -v
# Não use em produção: veja docs/implantacao.md.
name: gestao-obras-teste

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: obras_teste
      POSTGRES_DB: obras
    volumes:
      - teste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras -d obras"]
      interval: 5s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "8025:8025"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/scripts/docker-teste.sh"]
    environment:
      DATABASE_URL: postgresql://obras:obras_teste@db:5432/obras?schema=public
      APP_URL: http://localhost:3000
      APP_TEST_BANNER: "true"
      MAIL_DRIVER: smtp
      MAIL_FROM: "Gestão de Obras (teste) <nao-responda@exemplo.test>"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/.data/storage
    ports:
      - "3000:3000"
    volumes:
      - teste_appdata:/app/.data

volumes:
  teste_pgdata:
  teste_appdata:
